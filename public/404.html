<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scripting Library Showcase</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-content: center;
            justify-items: center;
            gap: 0.75rem;
            background: #05070c;
            color: #8debc4;
            font: 400 14px/1.6 ui-monospace, "JetBrains Mono", monospace;
        }
        a { color: #8debc4; }
    </style>
</head>
<body>
    <p>Opening the Scripting Library showcase&hellip;</p>
    <p><a id="fallback" href="./">Continue to the showcase</a></p>
    <noscript><p>This link needs JavaScript; open the showcase root instead.</p></noscript>
    <script>
        // GitHub Pages serves this file for any path it cannot find, *without* changing
        // the address bar - which is what makes the dashboard's own links work when
        // they are opened directly: /powershell, /powershell/update-git, and a
        // tolerated /powershell/update-git/docs.
        //
        // The shim cannot tell which leading segments are the deployment prefix (a
        // project site is served from a directory whose name looks like any other
        // segment), so it does not try: the requested path travels in `?path=` and the
        // dashboard strips its own prefix off it when it reads the route.
        //
        // `index.html` lives at the deployment root, so the way up is one directory per
        // hop - each hop drops the current document's own name and one segment above
        // it - and a hop counter stops a path that cannot resolve from looping.
        (function () {
            var params = new URLSearchParams(window.location.search || "");
            var requested = params.get("path") || (window.location.pathname + window.location.search);
            ["path", "script", "lang", "tab"].forEach(function (key) { params.delete(key); });
            var query = params.toString();

            var segments = window.location.pathname.split("/").filter(Boolean);
            if (segments.length > 0 && /^index\.html?$/i.test(segments[segments.length - 1])) {
                segments.pop();
            }
            if (segments.length > 0) {
                segments.pop();
            }
            var root = segments.length > 0 ? "/" + segments.join("/") + "/" : "/";
            var target = root + "index.html?path=" + encodeURIComponent(requested) +
                (query ? "&" + query : "");

            // The no-JavaScript fallback: the deployment root this hop resolved.
            document.getElementById("fallback").href = root;

            // Same favicon as the dashboard, built from that root (a plain relative href
            // would resolve against the deep junk path), so the icon shows meanwhile.
            var icon = document.createElement("link");
            icon.rel = "icon";
            icon.type = "image/png";
            icon.href = root + "logo.png";
            document.head.appendChild(icon);

            // Hard stops: at most four hops, and never re-request the address we are
            // already on.  The dashboard clears the counter as soon as it loads, so the
            // next bad link is free to try again.
            var hops = 0;
            try {
                hops = Number(sessionStorage.getItem("sl-404") || "0") + 1;
                sessionStorage.setItem("sl-404", String(hops));
            } catch (error) { hops = 0; }
            if (hops > 4 || target === window.location.pathname + window.location.search) { return; }
            window.location.replace(target);
        })();
    </script>
</body>
</html>
